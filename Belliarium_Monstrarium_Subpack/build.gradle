plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
    maven {
        name = "Modrinth maven"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

base {
    archivesName = "gh_belliarium_monstrarium"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        data {
            type = "data"
            programArguments.addAll '--mod', 'gh_belliarium_monstrarium',
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        gh_belliarium_monstrarium {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Atmospheric -- the Survivor's Diary restores season day, weather and wind through SeasonsAPI
    implementation project(":Atmospheric_Overhaul_Subpack")
    // Frontier -- map range setting (50k vs 100k blocks)
    implementation project(":Frontier_Subpack")
    // Curios API
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    // GeckoLib + PlayerAnimator, bundled INTO the mod jar (Jar-in-Jar, per
    // ModDevGradle docs) so the mod is self-contained in a real instance —
    // otherwise launch crashes with NoClassDefFoundError.
    jarJar(implementation("software.bernie.geckolib:geckolib-neoforge-1.21.1")) {
        version {
            strictly "[4.9.2,5.0)"
            prefer "4.9.2"
        }
    }
    jarJar(implementation("maven.modrinth:playeranimator")) {
        version {
            strictly "[2.0.4+1.21.1-forge]"
            prefer "2.0.4+1.21.1-forge"
        }
    }
}

// Logic for replacing variables in mods.toml
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : 'gh_belliarium_monstrarium',
            mod_name               : 'Belliarium_Monstrarium_Subpack',
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}